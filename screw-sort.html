  ensure(){

  daily(){
    // v11: soft morning chime when the daily challenge starts
    const n=[523.3,587.3,659.3,784];
    n.forEach((f,i)=>{ this.tone(f,f*1.005,0.3,"sine",0.08,i*0.12); this.tone(f*2,f*2,0.2,"triangle",0.03,i*0.12+0.02); });
  },
  undoSfx(){ this.tone(620,240,0.16,"sine",0.10); this.noise(0.12,0.05,0,2400,900,1.2); },
  hintSfx(){ this.tone(880,1760,0.18,"sine",0.08); this.tone(1320,2640,0.14,"sine",0.05,0.06); },
  star(i){
    const f=880*Math.pow(1.2,i);
    this.tone(f,f,0.16,"triangle",0.10);
    this.tone(f*2,f*2,0.12,"sine",0.05,0.02);
  },
  win(){
    const n=[523.3,659.3,784,1046.5,1318.5];
    n.forEach((f,i)=>{ this.tone(f,f,0.22,"triangle",0.10,i*0.10); this.tone(f/2,f/2,0.22,"sine",0.05,i*0.10); });
    this.thump(0.14,0.45);
    this.noise(0.5,0.05,0.3,3000,7000,1.0);
    // bigger finale: cymbal crash + sparkling top notes + deep boom
    this.noise(1.1,0.10,0.55,6000,9500,0.8);
    this.tone(1568,1568,0.30,"triangle",0.08,0.55);
    this.tone(2093,2093,0.42,"triangle",0.07,0.68);
    this.thump(0.20,0.55);
  },
  lose(){
    const n=[330,262,196,147];
    n.forEach((f,i)=>this.tone(f,f*0.92,0.26,"sawtooth",0.07,i*0.17));
    this.thump(0.20,0.55);
  },

  /* ----- generative workshop groove (subtle) ----- */
  gesture(){
    if(!this.ensure()) return;
    try{ if(this.ctx.state==="suspended") this.ctx.resume(); }catch(e){}
    this._musicWanted=true;
    this.startMusic();
  },
  startMusic(){
    if(this._musicOn||this.muted||!this._musicWanted||!this.ensure()) return;
    this._musicOn=true; this._mStep=0;
    this._mNext=this.ctx.currentTime+0.15;
    if(!this._mTimer) this._mTimer=setInterval(()=>{ try{ this._sched(); }catch(e){} },120);
  },
  onShow(){
    if(this._musicOn&&this.ctx) this._mNext=Math.max(this._mNext,this.ctx.currentTime+0.1);
  },
  setStyle(name){
    // v11: switch the generative groove style (workshop/drive/chill)
    if(this._style===name) return this;
    if(!MUSIC_STYLES[name]) name="workshop";
    this._style=name; this._mStep=0;
    try{ if(this.ctx) this._mNext=this.ctx.currentTime+0.15; }catch(e){}
    return this;
  },
  styleLabel(){ return MUSIC_STYLES[this._style||"workshop"].label; },
  _tick(t,hi,vs){
    const ctx=this.ctx, s=ctx.createBufferSource(); s.buffer=this._noiseBuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type="bandpass"; f.Q.value=3;
    f.frequency.value=hi?5200:3400;
    const g=ctx.createGain(), vol=0.028*(vs==null?1:vs);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    s.connect(f); f.connect(g); g.connect(this._musicBus);
    s.start(t); s.stop(t+0.1);
  },
  _pulse(t,hard){
    const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=hard?"triangle":"sine"; o.frequency.value=hard?45:55;
    const vol=hard?0.085:0.055;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+(hard?0.35:0.5));
    o.connect(g); g.connect(this._musicBus); o.start(t); o.stop(t+0.6);
    if(hard){ // drive kick click
      const n=ctx.createBufferSource(); n.buffer=this._noiseBuf; n.loop=true;
      const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=2500;
      const ng=ctx.createGain();
      ng.gain.setValueAtTime(0.05,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.05);
      n.connect(f); f.connect(ng); ng.connect(this._musicBus); n.start(t); n.stop(t+0.08);
    }
  },
  _pluckM(m,t,ds){
    const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=this.mf(m);
    const dur=0.9*(ds||1);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.045,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this._musicBus); o.start(t); o.stop(t+dur+0.1);
  },
  _sched(){
    if(!this._musicOn||this.muted||!this.ctx) return;
    if(typeof document!=="undefined"&&document.hidden){ this._mNext=this.ctx.currentTime+0.15; return; }
    // v11: the groove style follows the context (AUTO): workshop default,
    // drive = fast 4-kick for Time Attack, chill = sparse soft for Daily.
    const st=this._style||"workshop";
    const STEP=st==="drive"?0.1875:st==="chill"?0.5:0.25;
    if(this._mNext<this.ctx.currentTime-0.5) this._mNext=this.ctx.currentTime+0.1;
    while(this._mNext<this.ctx.currentTime+0.5){
      const s=this._mStep, t=this._mNext;
      if(st==="drive"){
        this._tick(t,(s%4)===2,1);
        if(s%4===0) this._pulse(t,true);
        if(s%8===6&&Math.random()<0.85) this._pluckM(pick([45,48,50,52,55,57,60]),t,0.8);
      }else if(st==="chill"){
        if(s%4===0) this._tick(t,false,0.55);
        if(s%8===4&&Math.random()<0.5) this._pluckM(pick([48,52,55,57,60,64]),t,1.7);
      }else{
        const PENTA=[57,60,62,64,67,69,72]; // A minor pentatonic-ish
        if(s%2===0) this._tick(t,(s%8)===4,1);
        if(s%8===0) this._pulse(t,false);
        if(s%16===12&&Math.random()<0.7) this._pluckM(pick(PENTA),t,1);
      }
      this._mNext+=STEP; this._mStep++;
    }
  },
};

/* ---------------- canvas setup ---------------- */
const LW=480, LH=800;
const canvas = document.getElementById("c");
const ctx = canvas ? canvas.getContext("2d", {alpha:false, desynchronized:true}) : null;
let SPR_DPR=2;
function effDPR(){ return clamp(window.devicePixelRatio||1, 2, 3); }
function fitCanvas(){
  if(!canvas) return;
  const ww=window.innerWidth||LW, wh=window.innerHeight||LH;
  const s=Math.min(ww/LW, wh/LH);
  const dpr=effDPR();
  canvas.width=Math.round(LW*s*dpr);
  canvas.height=Math.round(LH*s*dpr);
  canvas.style.width=Math.round(LW*s)+"px";
  canvas.style.height=Math.round(LH*s)+"px";
  if(ctx) ctx.setTransform(canvas.width/LW,0,0,canvas.height/LH,0,0);
  try{ buildSprites(dpr); }catch(e){}
}
if(typeof window!=="undefined" && window.addEventListener){
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", ()=>setTimeout(fitCanvas,120));
}

/* ---------------- drawing helpers ---------------- */
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function font(w,s){ return w+" "+s+"px "+SYSFONT; }
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(f<=1){ r*=f; g*=f; b*=f; } else { r+=(255-r)*(f-1); g+=(255-g)*(f-1); b+=(255-b)*(f-1); }
  r=Math.min(255,Math.round(r)); g=Math.min(255,Math.round(g)); b=Math.min(255,Math.round(b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function gloss(c,x,y,w,h,r,alpha){
  r=Math.min(r,w/2,h/2);
  c.save(); rr(c,x,y,w,h,r); c.clip();
  const g=c.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,"rgba(255,255,255,"+(alpha==null?0.35:alpha)+")");
  g.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=g; c.fillRect(x,y,w,h);
  c.restore();
}
function spaced(px){ try{ ctx.letterSpacing=px+"px"; }catch(e){} }
function unspaced(){ try{ ctx.letterSpacing="0px"; }catch(e){} }
function makeLayer(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(2,Math.round(w*SPR_DPR)); c.height=Math.max(2,Math.round(h*SPR_DPR));
  const g=c.getContext("2d"); g.setTransform(SPR_DPR,0,0,SPR_DPR,0,0);
  return {img:c, g:g, w:w, h:h};
}

/* ---------------- sprites (prerendered, visual only) ---------------- */
const Sprites={ bg:null, gears:{}, plates:{}, screws:{}, holes:{}, ui:{} };

function gearSprite(r, teeth, color){
  const key=r+"_"+teeth+"_"+(color||"d");   // v11: optional baked tint (theme gears)
  let s=Sprites.gears[key];
  if(s) return s;
  const d=(r+8)*2, L=makeLayer(d,d), c=L.g, cx=d/2, cy=d/2;
  c.fillStyle=color||"rgba(255,255,255,0.05)";
  c.beginPath();
  for(let i=0;i<teeth;i++){
    const a0=i/teeth*Math.PI*2, a1=(i+0.35)/teeth*Math.PI*2, a2=(i+0.5)/teeth*Math.PI*2, a3=(i+0.85)/teeth*Math.PI*2;
    if(i===0) c.moveTo(cx+Math.cos(a0)*(r+8), cy+Math.sin(a0)*(r+8));
    else c.lineTo(cx+Math.cos(a0)*(r+8), cy+Math.sin(a0)*(r+8));
    c.lineTo(cx+Math.cos(a1)*(r+8), cy+Math.sin(a1)*(r+8));
    c.lineTo(cx+Math.cos(a2)*r, cy+Math.sin(a2)*r);
    c.lineTo(cx+Math.cos(a3)*r, cy+Math.sin(a3)*r);
  }
  c.closePath(); c.fill();
  c.globalCompositeOperation="destination-out";
  c.beginPath(); c.arc(cx,cy,r*0.42,0,7); c.fill();
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2;
    c.beginPath(); c.arc(cx+Math.cos(a)*r*0.68, cy+Math.sin(a)*r*0.68, r*0.13, 0, 7); c.fill();
  }
  s={img:L.img,w:d,h:d};
  Sprites.gears[key]=s; return s;
}

function paintBackground(){
  const TH=curTheme();   // v11: the whole workshop re-skins per theme
  const L=makeLayer(LW,LH), c=L.g;
  // workshop wall
  let g=c.createLinearGradient(0,0,0,LH);
  g.addColorStop(0,TH.wall[0]); g.addColorStop(0.55,TH.wall[1]); g.addColorStop(1,TH.wall[2]);
  c.fillStyle=g; c.fillRect(0,0,LW,LH);
  // wall panels
  c.strokeStyle=TH.panel; c.lineWidth=2;
  for(let x=40;x<LW;x+=110){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,600); c.stroke(); }
  c.fillStyle=TH.panel;
  for(let x=40;x<LW;x+=110) for(let y=60;y<600;y+=130){
    c.beginPath(); c.arc(x+6,y+6,3,0,7); c.fill();
  }
  // warm lamp glow top-left (tinted per theme)
  const lg=c.createRadialGradient(90,60,10,90,60,260);
  lg.addColorStop(0,"rgba("+TH.lamp+",0.16)"); lg.addColorStop(1,"rgba("+TH.lamp+",0)");
  c.fillStyle=lg; c.fillRect(0,0,LW,340);
  // workbench floor
  g=c.createLinearGradient(0,592,0,LH);
  g.addColorStop(0,TH.floor[0]); g.addColorStop(0.12,TH.floor[1]); g.addColorStop(1,TH.floor[2]);
  c.fillStyle=g; c.fillRect(0,592,LW,LH-592);
  c.fillStyle="rgba(255,255,255,0.09)"; c.fillRect(0,592,LW,4);
  // floor planks + bolts
  c.strokeStyle="rgba(0,0,0,0.30)"; c.lineWidth=2;
  for(let x=0;x<LW;x+=80){ c.beginPath(); c.moveTo(x,600); c.lineTo(x,LH); c.stroke(); }
  c.fillStyle="rgba(0,0,0,0.35)";
  for(let x=40;x<LW;x+=80){ c.beginPath(); c.arc(x,640,4,0,7); c.fill(); c.beginPath(); c.arc(x,740,4,0,7); c.fill(); }
  // vignette
  const vg=c.createRadialGradient(LW/2,LH/2,LH*0.36,LW/2,LH/2,LH*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(3,6,14,0.42)");
  c.fillStyle=vg; c.fillRect(0,0,LW,LH);
  Sprites.bg=L.img; Sprites.bgTheme=Game.themeIdx;
}

function plateSprite(w,h){
  const key=w+"x"+h;
  let s=Sprites.plates[key];
  if(s) return s;
  const L=makeLayer(w,h), c=L.g;
  // drop shadow baked under? no — dynamic shadow drawn separately for popped anim.
  let g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#aeb9cf"); g.addColorStop(0.35,"#8b98b3");
  g.addColorStop(0.7,"#6e7b96"); g.addColorStop(1,"#59657f");
  c.fillStyle=g; rr(c,0,0,w,h,14); c.fill();
  // brushed metal streaks
  c.save(); rr(c,0,0,w,h,14); c.clip();
  c.strokeStyle="rgba(255,255,255,0.10)"; c.lineWidth=1;
  let seed=1234567;
  const srnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  for(let i=0;i<26;i++){
    const y=srnd()*h;
    c.globalAlpha=0.05+srnd()*0.08;
    c.beginPath(); c.moveTo(0,y); c.lineTo(w,y+srnd()*6-3); c.stroke();
  }
  c.globalAlpha=1; c.restore();
  // border
  c.lineWidth=3; c.strokeStyle="rgba(20,26,44,0.85)"; rr(c,1.5,1.5,w-3,h-3,13); c.stroke();
  c.lineWidth=1.5; c.strokeStyle="rgba(255,255,255,0.35)"; rr(c,5,5,w-10,h-10,10); c.stroke();
  gloss(c,4,4,w-8,h-8,11,0.22);
  // v11: real corner rivets (the comment above promised them since v4)
  for(const rp of [[13,13],[w-13,13],[13,h-13],[w-13,h-13]]){
    c.fillStyle="rgba(215,225,242,0.92)";
    c.beginPath(); c.arc(rp[0],rp[1],3.4,0,7); c.fill();
    c.fillStyle="rgba(60,70,95,0.9)";
    c.beginPath(); c.arc(rp[0],rp[1],1.4,0,7); c.fill();
  }
  // corner rivets (decorative; screws sit on top)
  s={img:L.img,w:w,h:h};
  Sprites.plates[key]=s; return s;
}

function screwSprite(ci){
  // robot screw head with a cute face — the brand centerpiece
  let s=Sprites.screws[ci];
  if(s) return s;
  const col=COLORS[ci], R=21, d=R*2+10, L=makeLayer(d,d), c=L.g, cx=d/2, cy=d/2;
  // outer thread ring (dark machined metal)
  c.fillStyle=shade(col.dark,0.45);
  c.beginPath(); c.arc(cx,cy,R,0,7); c.fill();
  c.strokeStyle="rgba(0,0,0,0.55)"; c.lineWidth=2.5;
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    c.beginPath();
    c.moveTo(cx+Math.cos(a)*(R-1), cy+Math.sin(a)*(R-1));
    c.lineTo(cx+Math.cos(a)*(R-5.5), cy+Math.sin(a)*(R-5.5));
    c.stroke();
  }
  // inner steel bezel
  const bz=c.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  bz.addColorStop(0,"rgba(235,240,252,0.55)"); bz.addColorStop(0.5,"rgba(120,132,160,0.25)"); bz.addColorStop(1,"rgba(10,14,26,0.45)");
  c.fillStyle=bz; c.beginPath(); c.arc(cx,cy,R-3.5,0,7); c.fill();
  // head dome
  const hg=c.createRadialGradient(cx-5,cy-6,2,cx,cy,R-4);
  hg.addColorStop(0,col.light); hg.addColorStop(0.55,col.main); hg.addColorStop(1,col.dark);
  c.fillStyle=hg; c.beginPath(); c.arc(cx,cy,R-4,0,7); c.fill();
  // machined concentric rings
  c.strokeStyle="rgba(255,255,255,0.10)"; c.lineWidth=1;
  for(const rr2 of [9,13]){ c.beginPath(); c.arc(cx,cy,rr2,0,7); c.stroke(); }
  c.strokeStyle="rgba(0,0,0,0.22)";
  c.beginPath(); c.arc(cx,cy,11,0,7); c.stroke();
  c.lineWidth=2; c.strokeStyle="rgba(0,0,0,0.35)";
  c.beginPath(); c.arc(cx,cy,R-4,0,7); c.stroke();
  gloss(c,cx-(R-4),cy-(R-4),(R-4)*2,(R-4)*2,R-4,0.35);
  // specular hot spot (studio light reflection)
  const sp2=c.createRadialGradient(cx-7,cy-9,0.5,cx-7,cy-9,7);
  sp2.addColorStop(0,"rgba(255,255,255,0.95)"); sp2.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=sp2; c.beginPath(); c.arc(cx-7,cy-9,7,0,7); c.fill();
  // screw slot (rotated at draw time)
  // robot face: eyes
  for(const ex of [-6.5,6.5]){
    c.fillStyle="#fff"; c.beginPath(); c.arc(cx+ex,cy-4,5.2,0,7); c.fill();
    c.fillStyle="#1c2438"; c.beginPath(); c.arc(cx+ex,cy-3.4,2.6,0,7); c.fill();
    c.fillStyle="#fff"; c.beginPath(); c.arc(cx+ex+0.9,cy-4.4,1,0,7); c.fill();
  }
  // smile
  c.strokeStyle="rgba(20,26,44,0.75)"; c.lineWidth=2; c.lineCap="round";
  c.beginPath(); c.arc(cx,cy+5,5,0.4,Math.PI-0.4); c.stroke();
  s={img:L.img,w:d,h:d,cx:cx,cy:cy,r:R};
  Sprites.screws[ci]=s; return s;
}

function holeSprite(r){
  const key="h"+r;
  let s=Sprites.holes[key];
  if(s) return s;
  const d=r*2+8, L=makeLayer(d,d), c=L.g, cx=d/2, cy=d/2;
  c.fillStyle="rgba(0,0,0,0.55)";
  c.beginPath(); c.arc(cx,cy,r,0,7); c.fill();
  const ig=c.createRadialGradient(cx,cy,r*0.3,cx,cy,r);
  ig.addColorStop(0,"rgba(0,0,0,0.75)"); ig.addColorStop(1,"rgba(0,0,0,0.25)");
  c.fillStyle=ig; c.beginPath(); c.arc(cx,cy,r,0,7); c.fill();
  c.strokeStyle="rgba(255,255,255,0.22)"; c.lineWidth=2.5;
  c.beginPath(); c.arc(cx,cy,r-1,0,7); c.stroke();
  c.strokeStyle="rgba(255,209,102,0.30)"; c.lineWidth=1.5;
  c.beginPath(); c.arc(cx,cy,r+2.5,0,7); c.stroke();
  s={img:L.img,w:d,h:d,cx:cx,cy:cy};
  Sprites.holes[key]=s; return s;
}

/* ================= SOLVER (hint + test autoWin; logic-identical to the Python verifier) ================= */
function solveState(remIds, trayCounts, plates, screws, K, H, budgetMs){
  const t0=(typeof performance!=="undefined")?performance.now():Date.now();
  const now=()=>(typeof performance!=="undefined")?performance.now():Date.now();
  const plateOf=[], colorOf=[], pinned=[];
  for(const s of screws){ plateOf[s.id]=s.plate; colorOf[s.id]=s.color; pinned[s.id]=s.pinned?1:0; }
  const player=plates.map(p=>p.layer);
  const prect=plates.map(p=>[p.x,p.y,p.x+p.w,p.y+p.h]);
  const covers={};
  for(const s of screws){
    const cov=[];
    for(let q=0;q<plates.length;q++){
      if(q===s.plate||player[q]<=player[s.plate]) continue;
      const r=prect[q];
      if(r[0]<=s.x&&s.x<=r[2]&&r[1]<=s.y&&s.y<=r[3]) cov.push(q);
    }
    covers[s.id]=cov;
  }
  const dead=new Set();
  let nodes=0;
  function unblocked(rem){
    const active=new Set();
    for(const id of rem) active.add(plateOf[id]);
    const out=[];
    for(const id of rem){
      const p=plateOf[id];
      if(pinned[id]){
        let cnt=0;
        for(const j of rem) if(plateOf[j]===p && ++cnt>1) break;
        if(cnt>1) continue;
      }
      let bad=false;
      const cv=covers[id];
      for(let k=0;k<cv.length;k++) if(active.has(cv[k])){ bad=true; break; }
      if(!bad) out.push(id);
    }
    return out;
  }
  function dfs(rem, tc){
    if(rem.length===0) return [];
    if((++nodes&511)===0 && now()-t0>budgetMs) throw 0;
    let occ=0; for(let i=0;i<tc.length;i++) occ+=tc[i];
    if(occ>=H) return null;
    const key=rem.join(",")+"|"+tc.join("");
    if(dead.has(key)) return null;
    const cands=unblocked(rem);
    if(!cands.length){ dead.add(key); return null; }
    cands.sort((a,b)=>tc[colorOf[b]]-tc[colorOf[a]]);
    for(let ci=0;ci<cands.length;ci++){
      const id=cands[ci], c=colorOf[id];
      const tc2=tc.slice(); tc2[c]++; if(tc2[c]===3) tc2[c]=0;
      const rem2=[]; for(let k=0;k<rem.length;k++) if(rem[k]!==id) rem2.push(rem[k]);
      const r=dfs(rem2,tc2);
      if(r){ r.unshift(id); return r; }
    }
    dead.add(key); return null;
  }
  try{ return dfs(remIds.slice(), trayCounts.slice()); }catch(e){ return null; }
}

/* ================= DAILY GENERATOR (v10) =================
   Deterministic level per calendar day, JS port of tools/gen_levels.py's
   constructive approach: plates empty in descending layer order, colors in
   monochromatic blocks of 3 along the tap sequence (tray never exceeds 2),
   max 1 pinned screw per plate, always last. Solvability is guaranteed by
   construction AND verified with the real runtime solver before use. */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genDailySpec(seed){
  for(let attempt=0; attempt<10; attempt++){
    const rng=mulberry32((seed*2654435761+attempt*97+11)|0);
    const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
    // 6 plates, 2 layers, overlapping
    const plates=[];
    for(let i=0;i<6;i++){
      const w=ri(130,190), h=ri(100,140);
      let x=ri(28,452-w), y=ri(118,560-h), placed=(i===0);
      for(let t=0;t<80&&!placed;t++){
        x=ri(28,452-w); y=ri(118,560-h); placed=true;
        for(const p of plates){
          if(x<p[0]+p[2]&&p[0]<x+w&&y<p[1]+p[3]&&p[1]<y+h){ placed=false; break; }
        }
        if(placed) break;
      }
      plates.push([x,y,w,h,ri(0,1)]);
    }
    if(plates[0][4]===plates[1][4]) plates[ri(0,5)][4]=1-plates[0][4]; // two distinct layers
    // slots per plate, 5 screws, pinned (max 1) last
    const perPlate=[];
    for(let pi=0;pi<6;pi++){
      const w=plates[pi][2], h=plates[pi][3];
      const slots=[[26,26],[w-26,26],[26,h-26],[w-26,h-26],[Math.floor(w/2),26],[Math.floor(w/2),h-26],[26,Math.floor(h/2)],[w-26,Math.floor(h/2)]];
      const idxs=[0,1,2,3,4,5,6,7];
      for(let k=idxs.length-1;k>0;k--){ const j=Math.floor(rng()*(k+1)); const tmp=idxs[k]; idxs[k]=idxs[j]; idxs[j]=tmp; }
      const pinIdx=rng()<0.15?ri(0,4):-1;
      const seq=[];
      for(let k=0;k<5;k++){ const s=slots[idxs[k]]; seq.push([s[0],s[1],k===pinIdx?1:0]); }
      seq.sort((a,b)=>a[2]-b[2]);
      perPlate.push(seq);
    }
    // empty order: high layers first
    const order=[0,1,2,3,4,5].sort((a,b)=>plates[b][4]-plates[a][4]);
    const tapSeq=[];
    for(const pi of order) for(const s of perPlate[pi]) tapSeq.push([pi,s[0],s[1],s[2]]);
    // monochromatic blocks of 3 along the tap sequence
    const tapColors=[];
    for(let i=0;i<tapSeq.length;){
      const c=Math.floor(rng()*5), n=Math.min(3,tapSeq.length-i);
      for(let k=0;k<n;k++) tapColors.push(c);
      i+=3;
    }
    const spec=[4,240,[]];
    for(let pi=0;pi<6;pi++){ const p=plates[pi]; spec[2].push([p[0],p[1],p[2],p[3],p[4],[]]); }
    for(let i=0;i<tapSeq.length;i++){ const t=tapSeq[i]; spec[2][t[0]][5].push([t[1],t[2],tapColors[i],t[3]]); }
    if(verifyDailySpec(spec)) return {spec:spec};
  }
  return null;
}
function verifyDailySpec(spec){
  try{
    const st=Game.parseSpec(spec);
    const sol=solveState(st.rem.slice(), new Array(st.K).fill(0), st.plates, st.screws, st.K, st.holes, 500);
    return !!(sol&&sol.length);
  }catch(e){ return false; }
}

/* ---------- level lifecycle ---------- */
// v10: spec parsing extracted so the daily generator can verify solvability
// with the real runtime solver before a level is built.
Game.parseSpec=function(spec){
  const holes=spec[0], par=spec[1];
  const plates=spec[2].map((p,pi)=>({
    x:p[0], y:p[1], w:p[2], h:p[3], layer:p[4],
    popped:false, popT:0, introDelay:pi*70, introLanded:false,
    screws: p[5].map((s,si)=>({ id: pi*100+si, plate: pi, color: s[2], pinned: !!s[3],
      dx:s[0], dy:s[1], x: p[0]+s[0], y: p[1]+s[1], rot: rnd(0,6.28),
      state:"plate", hole:-1, denyT:0, landT:0, wakeT:0, _wasBlocked:false,
      blinkT: rnd(0,4000), blinkC: rnd(2500,6500) }))
  }));
  const screws=[];
  plates.forEach(p=>p.screws.forEach(s=>screws.push(s)));
  const K=Math.max.apply(null, screws.map(s=>s.color).concat([0]))+1;
  return {holes:holes, par:par, K:K, plates:plates, screws:screws, rem:screws.map(s=>s.id)};
};
Game.buildLevel=function(idx,spec,mode){
  const st=this.parseSpec(spec);
  const noUndoOn=(mode!=="ta"&&this.noUndo);
  this.L={
    idx:idx, holes:st.holes, par:st.par, K:st.K, plates:st.plates, screws:st.screws,
    rem: st.rem,
    tray: new Array(st.holes).fill(null),   // screw ids or null
    counts: new Array(st.K).fill(0), clearedBy: new Array(st.K).fill(0),
    score:0, moves:0, undosLeft:(noUndoOn?0:3), undosUsed:0, cleared:0,
    maxCombo:0,
    startT: this.time, elapsed:0,
    mode:mode, noUndo:noUndoOn,   // "play" | "ta" | "daily"
    introT:0,   // 0..1 level-intro progress (plates drop in)
    flights:[],       // visual screw flights {screw, fx,fy, tx,ty, t,dur, phase, hole}
    clearing:[],      // visual trio flights {screw, fx,fy, t}
    combo:0, comboT:0, _warned:false,   // trio combo chain (8s window)
    coinFx:[], coinAnim:null,           // win coin fly-to-tally animation
    undoStack:[],
    hintId:-1, hintCd:0,
    undoCd:0,
    winT:-1, loseT:-1, won:false,
    taNextT:-1,   // time-attack: countdown to the next chained level
    tutDone: this.seenTut,
    popQueue:0,
  };
  this.parts=[]; this.floats=[];
  initMotes();
  // baseline blocked-state so newly exposed screws can "wake" later
  for(const s of st.screws) s._wasBlocked=this.isBlocked(s);
  this.screen="play";
  this.irisT=1;   // radial reveal wipe at level start (v5)
  try{ Portal.gameplayStart(); }catch(e){}
};
Game.loadLevel=function(idx){
  this.buildLevel(idx,LEVELS[idx],"play");
};
// v12: replay must respect the mode — loadLevel(-1) would break after a daily
Game.replayLevel=function(){
  const L=this.L;
  if(L&&L.mode==="daily"){ this.startDaily(); return; }
  if(L&&L.mode==="ta"){ this.startTimeAttack(); return; }
  this.loadLevel(this.levelIdx);
};
/* v10: TIME ATTACK — 90 seconds, chain random levels back to back, no win
   panels; a jammed tray costs 5 seconds instead of ending the run. */
Game.startTimeAttack=function(){

Game.endTimeAttack=function(){

/* v10: DAILY CHALLENGE — one deterministic level per calendar day (local),
   same for everyone, streak tracked. */
Game.dailySeedFor=function(d){
  return d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate();
};
Game.dailyDateStr=function(d){
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
};
Game.startDaily=function(){
  const now=new Date();
  const seed=this.dailySeedFor(now);
  const g=genDailySpec(seed);
  this._dailySpec=g?g.spec:[4,240,LEVELS[0][2]];
  this._dailyDate=this.dailyDateStr(now);
  this.levelIdx=-1;
  this.buildLevel(-1,this._dailySpec,"daily");
  Sfx.daily();   // v11: morning chime for the daily challenge
};
Game.dailyWin=function(L){
  const today=this._dailyDate, d=this.daily;
  if(d.date!==today){
    const y=this.dailyDateStr(new Date(Date.now()-86400000));
    d.streak=(d.date===y)?d.streak+1:1;
    d.date=today;
    Store.set("daily",JSON.stringify(d));
    L.newDaily=true;
  }
};

Game._smap=null;
Game.screwById=function(id){
  if(!this._smap||this._smapL!==this.L){
    this._smap={}; this._smapL=this.L;
    if(this.L) for(const s of this.L.screws) this._smap[s.id]=s;
  }
  return this._smap[id];
};

Game.isBlocked=function(s){
  const L=this.L, p=L.plates[s.plate];
  if(s.state!=="plate") return true;
  if(s.pinned){
    let cnt=0;
    for(const id of L.rem){ const o=this.screwById(id); if(o&&o.plate===s.plate&&++cnt>1) return true; }
  }
  for(const q of L.plates){
    if(q.popped||q.layer<=p.layer||q===p) continue;
    if(s.x>=q.x&&s.x<=q.x+q.w&&s.y>=q.y&&s.y<=q.y+q.h) return true;
  }
  return false;
};

Game.tappable=function(){
  const L=this.L, out=[];
  for(const id of L.rem){
    const s=this.screwById(id);
    if(s&&s.state==="plate"&&!this.isBlocked(s)) out.push(id);
  }
  out.sort((a,b)=>a-b);
  return out;
};

Game.freeHole=function(){
  const L=this.L;
  for(let i=0;i<L.holes;i++) if(L.tray[i]===null||L.tray[i]===undefined) return i;
  return -1;
};

/* ---------- core action: tap a screw ---------- */
Game.tapScrewById=function(id){
  const L=this.L;
  if(!L||this.screen!=="play") return false;
  const s=this.screwById(id);
  if(!s||s.state!=="plate"||this.isBlocked(s)) return false;
  const hole=this.freeHole();
  if(hole<0){
    s.denyT=350; Sfx.deny(); vibrate(30);
    this.shake=Math.max(this.shake,70);   // tray nudge on deny
    this.ring(s.x,s.y,8,58,"#f87171",360); // red "no" pulse at the denied screw
    this.floater(s.x,s.y-30,"TRAY FULL!","#f87171",16);
    return false;
  }
  // snapshot for undo (logic state only — instant)
  L.undoStack.push(this.snap());
  if(L.undoStack.length>60) L.undoStack.shift();
  // logic (instant; visuals catch up)
  L.rem=L.rem.filter(x=>x!==id);
  s.state="tray"; s.hole=hole;
  L.tray[hole]=id;
  L.counts[s.color]++;
  L.moves++; L.score+=10;
  L.hintId=-1;
  if(!L.tutDone){ L.tutDone=true; this.seenTut=true; Store.set("seenTut","1"); }
  // visuals: unscrew then fly
  L.flights.push({screw:s, fx:s.x, fy:s.y, tx:holeX(hole,L.holes), ty:TRAY_Y,
    t:0, dur:520, phase:"unscrew", hole:hole});
  Sfx.ratchet(); vibrate(12);
  try{ Portal.scoreChanged(L.score); }catch(e){}
  // trio clear?
  if(L.counts[s.color]>=3) this.clearTrio(s.color);
  // plate pop?
  const p=L.plates[s.plate];
  let anyLeft=false;
  for(const q of p.screws) if(q.state==="plate"){ anyLeft=true; break; }
  if(!anyLeft&&!p.popped){
    p.popped=true; p.popT=0.0001; L.popQueue++;
    L.score+=50;
    this.plateBurst(p);
    this.ring(p.x+p.w/2,p.y+p.h/2,26,150,"#fde047",560);  // second, wider shockwave
    Sfx.pop(); vibrate(35);
    this.shake=Math.max(this.shake,200);
    this.punch=1;   // screen punch zoom
    this.floater(p.x+p.w/2, p.y+10, "+50", "#fde047", 18);
  }
  this.checkEnd();
  return true;
};

Game.clearTrio=function(color){
  const L=this.L;
  const ids=[];
  for(let i=0;i<L.holes&&ids.length<3;i++){
    const id=L.tray[i];
    if(id!=null){ const s=this.screwById(id); if(s&&s.color===color) ids.push(i); }
  }
  if(ids.length<3) return;
  for(const h of ids){
    const id=L.tray[h], s=this.screwById(id);
    L.tray[h]=null;
    if(s){ L.clearing.push({screw:s, fx:s.x, fy:s.y, t:0}); s.state="gone"; }
  }
  L.counts[color]=0;
  L.clearedBy[color]+=3;
  // combo: chain trios inside the 8s window for multiplied scores + bigger juice
  L.combo=(L.comboT>0)?(L.combo||0)+1:1;
  L.comboT=8000;
  if(L.combo>(L.maxCombo||0)) L.maxCombo=L.combo;
  const pts=25*L.combo;
  L.cleared+=3; L.score+=pts;
  Sfx.triple(L.combo); Sfx.trioTicks(); vibrate([20,40,20]);
  const big=1+Math.min(3,L.combo-1)*0.28;
  this.sparkle(240,TRAY_Y,COLORS[color].light,10+L.combo*3);
  this.flash(240,TRAY_Y,8,Math.round(95*big),COLORS[color].light,380);
  this.ring(240,TRAY_Y,14,Math.round(80*big),COLORS[color].light,420);
  if(L.combo>=2) this.ring(240,TRAY_Y,22,Math.round(115*big),COLORS[color].main,540);
  this.floater(240,TRAY_Y-46,
    L.combo>1?("COMBO x"+L.combo+"! +"+pts):("SORTED! +"+pts),
    L.combo>1?"#fde047":"#4ade80", L.combo>1?19:17);
  if(L.combo===2) this.floater(240,TRAY_Y-80,"CHAIN TRIOS FOR BONUS!","#fbbf24",14);
};

Game.checkEnd=function(){
  const L=this.L;
  if(!L||L.won||L.winT>=0||L.loseT>=0) return;
  if(L.rem.length===0){ L.winT=750; return; }
  let occ=0, mx=0;
  for(let i=0;i<L.holes;i++) if(L.tray[i]!=null) occ++;
  for(let c=0;c<L.K;c++) mx=Math.max(mx,L.counts[c]);
  if(occ>=L.holes&&mx<3&&L.rem.length>0){ L.loseT=900; }
};

Game.onWin=function(){
  const L=this.L;
  L.won=true;
  const t=(this.time-L.startT)/1000;
  L.elapsed=t;
  let stars=1;
  if(L.undosUsed===0&&t<=L.par) stars=3;
  else if(L.undosUsed<=2&&t<=L.par*1.6) stars=2;
  L.stars=stars;
  // campaign only: stars + unlocks (daily/ta don't touch the level map)
  if(L.mode==="play"){
    const prev=this.stars[this.levelIdx]||0;
    if(stars>prev){ this.stars[this.levelIdx]=stars; Store.set("stars",JSON.stringify(this.stars)); }
    if(this.levelIdx+1<LEVELS.length&&this.unlocked<this.levelIdx+2){
      this.unlocked=this.levelIdx+2; Store.set("unlocked",String(this.unlocked));
    }
    this.checkThemeUnlocks();   // v11: announce freshly unlocked themes
  }
  const bonus=50+stars*25;
  const earned=bonus+Math.floor(L.score/10);
  L.earnedCoins=earned;
  // v10: lifetime stats (all modes)
  const st=this.stats;
  st.wins++; st.trios+=Math.round(L.cleared/3); st.screws+=L.cleared;
  st.moves+=L.moves; st.ms+=Math.round(t*1000);
  if((L.maxCombo||0)>st.bestCombo) st.bestCombo=L.maxCombo;
  Store.set("stats",JSON.stringify(st));
  // v10: TIME ATTACK — fast tally, no panels: chain the next level
  if(L.mode==="ta"){
    this.coins+=earned; this.coinsShown=this.coins;
    Store.set("coins",String(this.coins));
    this.completions++;
    Store.set("completions",String(this.completions));
    this.ta.score+=L.score; this.ta.trios+=Math.round(L.cleared/3);
    this.ta.plates+=L.plates.filter(p=>p.popped).length;
    this.floater(240,380,"LEVEL CLEAR!  +$"+earned,"#fde047",20);
    this.floater(240,412,"SCORE "+this.ta.score,"#fdba74",16);
    for(let i=0;i<14;i++){
      const a=Math.random()*Math.PI*2, sp=rnd(120,300);
      this.parts.push({x:240,y:400,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-140,t:0,
        life:rnd(500,900),r:rnd(2.5,4.5),col:pick(["#fde047","#fdba74","#fbbf24"]),g:600});
    }
    L.taNextT=1500;
    Sfx.win(); vibrate([40,60,40]);
    return; // screen stays "play"; tick() chains the next level
  }
  // v10: DAILY streak (records only for campaign levels)
  if(L.mode==="daily"){
    this.dailyWin(L);
  }else{
    const rec=this.records[this.levelIdx];
    L.newRecord=false;
    if(!rec||L.moves<rec.m||(L.moves===rec.m&&t<rec.t)){
      this.records[this.levelIdx]={m:L.moves,t:Math.round(t)};
      Store.set("records",JSON.stringify(this.records));
      L.newRecord=true;
      try{ setTimeout(()=>{ try{ Sfx.record(); }catch(e){} },900); }catch(e){}   // v11: record fanfare
    }
  }
  // coin shower: radial gold burst from the panel on win (v8)
  for(let i=0;i<26;i++){
    const a=Math.random()*Math.PI*2, sp=rnd(120,340);
    this.parts.push({x:240,y:410,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-160,t:0,
      life:rnd(600,1100),r:rnd(2.5,5),col:pick(["#fde047","#fbbf24","#fef3c7","#f59e0b"]),g:600});
  }
  this.flash(240,410,10,150,"rgba(253,224,71,0.5)",500);
  const before=this.coins;
  this.coins+=earned;
  this.coinsShown=before;   // animates up in tick() as coins land
  L.coinAnim={from:before,to:this.coins,earned:earned,t:0};
  L.coinFx=[];
  for(let i=0;i<12;i++)
    L.coinFx.push({fx:240+rnd(-110,110),fy:300+rnd(-40,40),x:0,y:0,tx:240,ty:424,t:-i*65,dur:620});
  Store.set("coins",String(this.coins));
  this.completions++;
  Store.set("completions",String(this.completions));
  this.screen="win";
  L.winFxT=0;
  L.confetti=[];
  const ccols=["#fde047","#4ade80","#60a5fa","#f472b6","#fbbf24","#a78bfa","#ffffff"];
  for(let i=0;i<110;i++) L.confetti.push({
    x:rnd(0,480), y:rnd(-60,840), vy:rnd(60,170), vr:rnd(-4,4),
    s:rnd(3,6), ph:rnd(0,6.28), col:pick(ccols), rect:Math.random()<0.4
  });
  Sfx.win(); vibrate([40,60,40]);
  try{ Portal.gameplayStop(); }catch(e){}
};

Game.onLose=function(){
  // v10: in TIME ATTACK a jammed tray costs 5 seconds, not the run
  if(this.L&&this.L.mode==="ta"){
    this.ta.left=Math.max(0,this.ta.left-5000);
    this.floater(240,400,"JAMMED!  -5s","#f87171",22);
    Sfx.lose(); vibrate([80,50,80]);
    this.loadLevelTA();
    return;
  }
  this.screen="lose";
  if(this.L) this.L.loseFxT=0;
  Sfx.lose(); vibrate([80,50,80]);
  try{ Portal.gameplayStop(); }catch(e){}
};

/* ---------- undo / hint ---------- */
Game.snap=function(){
  const L=this.L;
  return { rem:L.rem.slice(), tray:L.tray.slice(), counts:L.counts.slice(),
    clearedBy:L.clearedBy.slice(),
    popped:L.plates.map(p=>p.popped), score:L.score, moves:L.moves,
    undosUsed:L.undosUsed, cleared:L.cleared };
};
Game.restore=function(sn){
  const L=this.L;
  L.rem=sn.rem.slice(); L.tray=sn.tray.slice(); L.counts=sn.counts.slice();
  L.clearedBy=sn.clearedBy.slice();
  L.score=sn.score; L.moves=sn.moves; L.undosUsed=sn.undosUsed; L.cleared=sn.cleared;
  L.plates.forEach((p,i)=>{ p.popped=sn.popped[i]; if(!p.popped) p.popT=0; });
  const onPlate=new Set(L.rem), inTray=new Map();
  L.tray.forEach((id,h)=>{ if(id!=null) inTray.set(id,h); });
  for(const s of L.screws){
    if(onPlate.has(s.id)){ s.state="plate"; s.hole=-1; }
    else if(inTray.has(s.id)){ s.state="tray"; s.hole=inTray.get(s.id); }
    else { s.state="gone"; s.hole=-1; }
  }
  L.flights=[]; L.clearing=[]; L.hintId=-1; L.winT=-1; L.loseT=-1; L.won=false;
  L.combo=0; L.comboT=0; L._warned=false;   // undo breaks the combo chain
};

Game.doUndo=function(){
  const L=this.L;
  if(!L||this.screen!=="play") return;
  // v10: no-undo mode — undos are locked for the whole level
  if(L.noUndo){ Sfx.deny(); this.floater(240,480,"NO-UNDO MODE","#94a3b8",16); return; }
  if(L.undosLeft<=0){
    this.grantViaAdOrCooldown("undo",()=>{
      L.undosLeft+=2; Sfx.hintSfx();
      this.floater(240,480,"+2 UNDO","#4ade80",18);
    },"undo");
    return;
  }
  const sn=L.undoStack.pop();
  if(!sn){ Sfx.deny(); return; }
  L.undosLeft--; L.undosUsed++;
  this.restore(sn);
  // rewind ripple: blue ring + flash burst from the tray (v8)
  this.ring(240,TRAY_Y,10,130,"rgba(147,197,253,0.85)",450);
  this.flash(240,TRAY_Y,10,150,"rgba(147,197,253,0.35)",350);
  for(let i=0;i<8;i++) this.sparkle(240+rnd(-90,90),TRAY_Y+rnd(-20,20),"#bfdbfe",1);
  Sfx.undoSfx();
  this.floater(240,480,"UNDO","#93c5fd",18);
};

Game.doHint=function(){
  const L=this.L;
  if(!L||this.screen!=="play"||L.hintId>=0) return;
  const use=()=>{
    const rem=L.rem.filter(id=>{ const s=this.screwById(id); return s&&s.state==="plate"; });
    let sol=null;
    try{ sol=solveState(rem,L.counts.slice(),L.plates,L.screws,L.K,L.holes,300); }catch(e){ sol=null; }
    let id=-1;
    if(sol&&sol.length){
      id=sol[0];
      const s=this.screwById(id);
      if(!s||this.isBlocked(s)) id=-1;
    }
    if(id<0){
      // heuristic fallback: color with most in tray, else any tappable
      const tap=this.tappable();
      if(!tap.length){ Sfx.deny(); return; }
      let best=tap[0], bs=-1;
      for(const tid of tap){
        const s=this.screwById(tid), sc=L.counts[s.color]*10+(s.pinned?0:1);
        if(sc>bs){ bs=sc; best=tid; }
      }
      id=best;
    }
    L.hintId=id;
    Sfx.hintSfx();
  };
  this.grantViaAdOrCooldown("hint",use,"hint");
};

Game.grantViaAdOrCooldown=function(kind,grant,label){
  const L=this.L;
  const P=(typeof window!=="undefined")?window.Portal:null;
  if(P&&typeof P.rewarded==="function"){
    try{ P.rewarded(function(ok){ if(ok){ try{grant();}catch(e){} } }); }catch(e){}
    return;
  }
  const now=Date.now(), last=L["cd_"+kind]||0, WAIT=90000;
  if(now-last>=WAIT){ L["cd_"+kind]=now; try{grant();}catch(e){} }
  else{
    const s=Math.ceil((WAIT-(now-last))/1000);
    Sfx.deny();
    this.floater(240,480,"FREE "+label.toUpperCase()+" IN "+s+"s","#f87171",16);
  }
};

};

Game.plateBurst=function(p){

  for(let i=0;i<16;i++) this.sparkle(cx+rnd(-50,50),cy+rnd(-26,26),"#fde047",1);
  for(let i=0;i<6;i++) this.sparkle(cx+rnd(-30,30),cy+rnd(-18,18),"#ffffff",1);
  this.flash(cx,cy,10,130,"rgba(253,224,71,0.6)",460);

Game.floater=function(x,y,txt,col,size){

/* ---------- tick ---------- */
Game.tick=function(dt){
  this.time+=dt;
  if(this.shake>0) this.shake=Math.max(0,this.shake-dt*1.4);
  if(this.punch>0) this.punch=Math.max(0,this.punch-dt/240);
  if(this.fade>0) this.fade=Math.max(0,this.fade-dt);
  if(this.irisT>0) this.irisT=Math.max(0,this.irisT-dt/650);
  // select-screen stagger pop-in timer (v6)
  if(this.screen!==this._lastScreen){ this._lastScreen=this.screen; if(this.screen==="select") this.selectT=0; }
  if(this.screen==="select") this.selectT=(this.selectT||0)+dt;
  this.floats.forEach(f=>{f.t+=dt; f.y-=36*dt/1000;});
  this.floats=this.floats.filter(f=>f.t<f.life);
  this.parts.forEach(p=>{ p.t+=dt; p.vy+=(p.g||0)*dt/1000; p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; if(p.vr) p.rot+=p.vr*dt/1000; });
  this.parts=this.parts.filter(p=>p.t<p.life&&p.y<860);
  // ambient motes drift on every screen
  if(this.motes) for(const m of this.motes){
    m.x+=m.vx*dt/1000; m.y+=m.vy*dt/1000;
    if(m.y<-6){ m.y=806; m.x=rnd(0,480); }
    if(m.x<-6) m.x=486; else if(m.x>486) m.x=-6;
  }
  // steam puffs from the wall vents (every screen)
  this._steamT+=dt;
  if(this._steamT>1300){
    this._steamT=0; this._steamFlip=!this._steamFlip;
    const sx2=this._steamFlip?34:446, sy2=this._steamFlip?556:542;
    this.parts.push({steam:1,x:sx2,y:sy2,vx:rnd(-6,6),vy:rnd(-48,-30),life:rnd(1600,2400),t:0,r:rnd(5,8)});
  }
  // title logo sparkles
  if(this.screen==="title"&&Math.random()<dt/420){
    this.sparkle(rnd(70,410),rnd(292,392),"#ffffff",1);
  }
  // lose screen: tray screws wobble dizzily + dust settles from the tray
  if(this.screen==="lose"&&this.L){
    const Lz=this.L;
    for(let i=0;i<Lz.holes;i++){
      const id=Lz.tray[i];
      if(id==null) continue;
      const s=this.screwById(id);
      if(s) s.rot=Math.sin(this.time/330+i*1.7)*0.55;
    }
    if(Math.random()<dt/1100){
      this.parts.push({x:holeX((Math.random()*Lz.holes)|0,Lz.holes)+rnd(-14,14),y:TRAY_Y+14,
        vx:rnd(-24,24),vy:rnd(-60,-20),life:rnd(500,900),t:0,
        col:"rgba(148,163,184,0.55)",r:rnd(3,5),g:-40});
    }
  }
  const L0=this.L;
  if(L0&&L0.winFxT!=null) L0.winFxT+=dt;   // win-screen star animation runs on any screen
  if(L0&&L0.loseFxT!=null) L0.loseFxT+=dt;  // lose-screen headline stagger (v7)
  // lose-screen tears: blue drops fall from the sad screw's eyes (v7)
  if(this.screen==="lose"&&Math.random()<0.22){
    this.parts.push({x:240+rnd(-16,16),y:318,vx:rnd(-12,12),vy:rnd(30,80),t:0,
      life:rnd(500,900),r:rnd(2.5,4),col:"#7dd3fc",g:520});
  }
  if(L0&&L0.winFxT!=null&&L0.stars){
    // sparkle burst + ring as each win star pops in (v5)
    if(L0._starFxN==null) L0._starFxN=0;
    while(L0._starFxN<L0.stars&&L0.winFxT>L0._starFxN*350+180){
      const sx=240+(L0._starFxN-1)*70;
      this.sparkle(sx,330,"#fde047",10);
      this.ring(sx,330,8,54,"rgba(253,224,71,0.9)",380);
      L0._starFxN++;
    }
  }
  // win coin tally + flying coins (must run on the win screen too)
  if(L0&&L0.coinAnim){
    L0.coinAnim.t+=dt;
    const k=easeOut(clamp(L0.coinAnim.t/1100,0,1));
    Game.coinsShown=Math.round(lerp(L0.coinAnim.from,L0.coinAnim.to,k));
    if(k>=1){ Game.coinsShown=L0.coinAnim.to; L0.coinAnim=null; }
  }
  if(L0&&L0.coinFx){
    for(let i=L0.coinFx.length-1;i>=0;i--){
      const cf=L0.coinFx[i];
      cf.t+=dt;
      if(cf.t<0) continue;
      const kk=clamp(cf.t/cf.dur,0,1), e=easeInOut(kk);
      cf.x=lerp(cf.fx,cf.tx,e); cf.y=lerp(cf.fy,cf.ty,e)-Math.sin(kk*Math.PI)*46;
      if(kk>=1){ L0.coinFx.splice(i,1); Sfx.coinTick(); this.sparkle(cf.tx,cf.ty,"#fde047",4); }
    }
  }
  if(this.screen!=="play"||!this.L) return;
  const L=this.L;
  // level intro progress (plates drop in)
  if(L.introT<1) L.introT=Math.min(1,L.introT+dt/1150);
  // screw life: blinking eyes + landing squash decay + wake bounce decay
  for(const s of L.screws){
    s.blinkT=(s.blinkT||0)+dt;
    if(s.blinkT>(s.blinkC||4000)){ s.blinkT=0; s.blinkC=rnd(2500,6500); }
    if(s.landT>0) s.landT=Math.max(0,s.landT-dt/280);
    if(s.wakeT>0) s.wakeT=Math.max(0,s.wakeT-dt/380);
    if(s.denyT>0) s.denyT-=dt;
    // wake bounce the moment a screw becomes tappable (its cover popped)
    if(s.state==="plate"){
      const b=this.isBlocked(s);
      if(!b&&s._wasBlocked) s.wakeT=1;
      s._wasBlocked=b;
    }
  }
  // combo decay
  if(L.comboT>0){ L.comboT-=dt; if(L.comboT<=0){ L.combo=0; L.comboT=0; } }
  // tray nearly full warning (once per fill)
  let freeN=0;
  for(let i=0;i<L.holes;i++) if(L.tray[i]==null) freeN++;
  L.danger=(freeN===1&&L.winT<0&&L.loseT<0);   // drives the red edge vignette (v6)
  // combo embers: flame sparks rising from the combo badge (v7)
  if(L.combo>=2&&this.screen==="play"&&L.winT<0&&L.loseT<0&&Math.random()<0.4){
    this.parts.push({x:240+rnd(-72,72),y:TRAY_Y-72,vx:rnd(-24,24),vy:rnd(-150,-70),t:0,
      life:rnd(400,800),r:rnd(2,4),col:pick(["#fb923c","#fbbf24","#f87171","#fde047"])});
  }
  if(freeN===1&&!L._warned&&L.winT<0&&L.loseT<0){ L._warned=true; Sfx.warning(); }
  else if(freeN!==1) L._warned=false;
  // plate intro landings: clank + dust as each plate touches down
  for(const p of L.plates){
    if(!p.introLanded&&p.introDelay!=null){
      const k=clamp((L.introT*1200-p.introDelay)/480,0,1);
      if(k>=1){
        p.introLanded=true;
        Sfx.clank();
        for(let i=0;i<6;i++)
          this.parts.push({x:p.x+rnd(0,p.w),y:p.y+p.h-6,vx:rnd(-60,60),vy:rnd(-90,-20),
            life:rnd(300,600),t:0,col:"rgba(174,185,207,0.8)",r:rnd(2,4),g:300});
      }
    }
  }
  // screw flights
  for(let i=L.flights.length-1;i>=0;i--){
    const f=L.flights[i];
    f.t+=dt;
    if(f.phase==="unscrew"){
      const k=clamp(f.t/200,0,1);
      f.screw.rot+=dt/1000*22;
      if(k>=1){
        f.phase="fly"; f.t=0;
        this.sparkle(f.fx,f.fy,"#dbe4f0",3);   // metal dust where the screw popped out
      }
    }else{
      const k=clamp(f.t/320,0,1), e=easeInOut(k);
      const px=lerp(f.fx,f.tx,e), py=lerp(f.fy,f.ty,e)-Math.sin(k*Math.PI)*70;
      f.trail=(f.trail||0)+dt;
      if(f.trail>50){                          // motion-trail sparkle while flying
        f.trail=0;
        this.parts.push({x:px+rnd(-6,6),y:py+rnd(-6,6),vx:rnd(-20,20),vy:rnd(-30,10),
          life:rnd(220,420),t:0,col:"rgba(255,255,255,0.75)",r:rnd(1.5,2.8),g:0});
      }
      if(k>=1){
        L.flights.splice(i,1);
        const s=f.screw;
        s.x=f.tx; s.y=f.ty; s.landT=1;
        // landing pitch ladder: fast consecutive landings climb musically (ASMR)
        const now=this.time;
        const streak=(now-(this._landT||0)<1200)?((this._landStreak||0)+1):0;
        this._landStreak=streak; this._landT=now;
        Sfx.clink(0.92+Math.min(streak,8)*0.045); Sfx.land();
        this.impactBurst(f.tx,f.ty);
        this.shake=Math.max(this.shake,46);   // satisfying seat thump
      }
    }
  }
  // trio clearing flights (to the bin)
  for(let i=L.clearing.length-1;i>=0;i--){
    const c=L.clearing[i];
    c.t+=dt;
    const k=clamp(c.t/450,0,1), e=easeIn(k);
    c.screw.x=lerp(c.fx,BIN_X,e); c.screw.y=lerp(c.fy,BIN_Y,e)-Math.sin(k*Math.PI)*60;
    c.screw.rot+=dt/1000*26;
    c.trail=(c.trail||0)+dt;
    if(c.trail>70){ c.trail=0; this.sparkle(c.screw.x,c.screw.y,"#fde047",1); }
    if(k>=1){ L.clearing.splice(i,1); this.sparkle(BIN_X,BIN_Y,"#4ade80",6); }
  }
  // popped plates anim
  for(const p of L.plates){
    if(p.popped&&p.popT<1){ p.popT=Math.min(1,p.popT+dt/650); }
  }
  if(L.popQueue>0){
    let done=true;
    for(const p of L.plates) if(p.popped&&p.popT<1){ done=false; break; }
    if(done) L.popQueue=0;
  }
  if(L.hintCd>0) L.hintCd-=dt;
  // v10: TIME ATTACK — 90s countdown + chain the next level after a clear
  if(L.mode==="ta"&&this.screen==="play"&&this.ta){
    if(L.won){
      if(L.taNextT>0){ L.taNextT-=dt; if(L.taNextT<=0){ L.taNextT=-1; this.loadLevelTA(); } }
    }else{
      this.ta.left-=dt;
      if(this.ta.left<=0){ this.ta.left=0; this.endTimeAttack(); }
    }
  }
  if(L.winT>0){ L.winT-=dt; if(L.winT<=0){ L.winT=-1; this.onWin(); } }
  else if(L.loseT>0){ L.loseT-=dt; if(L.loseT<=0){ L.loseT=-1; this.onLose(); } }
};
function hit(x,y,r){ return r&&x>=r.x&&y>=r.y&&x<=r.x+r.w&&y<=r.y+r.h; }

/* ================= RENDERER ================= */
const TRAY_Y=648, BIN_X=428, BIN_Y=84;
function holeX(i,H){ return 40+(i+0.5)*((LW-80)/H); }

function button(x,y,w,h,label,sub,color,small){
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,0.35)";
  rr(ctx,x,y+4,w,h,14); ctx.fill();
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,shade(color,1.25)); g.addColorStop(0.5,color); g.addColorStop(1,shade(color,0.75));
  ctx.fillStyle=g; rr(ctx,x,y,w,h,14); ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle="rgba(0,0,0,0.35)"; rr(ctx,x+1,y+1,w-2,h-2,13); ctx.stroke();
  gloss(ctx,x+3,y+3,w-6,h-6,11,0.30);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff";
  ctx.font=font(800,small?15:19);
  spaced(1);

function drawBackground(){
  if(Sprites.bg) ctx.drawImage(Sprites.bg,0,0,LW,LH);
  const TH=curTheme();   // v11: ambient lighting follows the active theme
  // slow ambient gears
  const t=Game.time/1000;
  const gears=[[120,180,64,10,0.05],[392,300,88,12,-0.035],[90,470,52,9,0.07],[410,140,40,8,-0.09]];
  for(const gx of gears){
    const s=gearSprite(gx[2],gx[3],TH.gear);
    ctx.save(); ctx.translate(gx[0],gx[1]); ctx.rotate(t*gx[4]);
    ctx.globalAlpha=0.9;
    ctx.drawImage(s.img,-s.w/2,-s.h/2,s.w,s.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // v11: LED chase strip along the top (theme accent)
  for(let i=0;i<24;i++){
    const x=10+i*20;
    const on=(((Game.time/110)|0)+i)%10<3;
    ctx.fillStyle=on?TH.accent:"rgba(120,140,175,0.18)";
    ctx.beginPath(); ctx.arc(x,18,3.2,0,7); ctx.fill();
  }
  // v11: slow conveyor drift on the floor
  ctx.save(); ctx.beginPath(); ctx.rect(0,596,LW,LH-596); ctx.clip();
  ctx.strokeStyle=TH.panel; ctx.lineWidth=3;
  const coff=(Game.time/60)%56;
  for(let x=-56;x<LW+56;x+=56){
    ctx.beginPath(); ctx.moveTo(x+coff,800); ctx.lineTo(x+coff+40,596); ctx.stroke();
  }
  ctx.restore();
  // hanging chains, swaying gently
  const t2=Game.time/1000;
  for(const chx of [150,330]){
    ctx.save(); ctx.translate(chx,0); ctx.rotate(Math.sin(t2*0.9+chx)*0.05);
    ctx.strokeStyle="rgba(160,175,205,0.32)"; ctx.lineWidth=5;
    for(let i=0;i<6;i++){ ctx.beginPath(); ctx.ellipse(0,30+i*22,7,11,0,0,7); ctx.stroke(); }
    ctx.fillStyle="rgba(160,175,205,0.38)";
    ctx.beginPath(); ctx.arc(0,30+6*22,10,0,7); ctx.fill();
    ctx.restore();
  }
  // steam vent grilles on the wall
  for(const vx of [[34,566],[446,552]]){
    ctx.fillStyle="rgba(0,0,0,0.40)"; rr(ctx,vx[0]-16,vx[1]-10,32,20,6); ctx.fill();
    ctx.strokeStyle="rgba(160,175,205,0.50)"; ctx.lineWidth=2;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(vx[0]-10,vx[1]-4+i*4); ctx.lineTo(vx[0]+10,vx[1]-4+i*4); ctx.stroke(); }
  }
  // blinking status LEDs
  const ledCols=[TH.accent,"#f87171",TH.accent2];   // v11: LEDs tinted by theme
  for(let i=0;i<3;i++){
    const on=Math.sin(t2*3+i*2.1)>0;
    if(on){
      ctx.save(); ctx.globalCompositeOperation="lighter";
      ctx.fillStyle=ledCols[i]+"44";
      ctx.beginPath(); ctx.arc(416+i*18,120,9,0,7); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle=on?ledCols[i]:"rgba(80,90,115,0.5)";
    ctx.beginPath(); ctx.arc(416+i*18,120,4.5,0,7); ctx.fill();
  }
  // warm lamp flicker overlay (v11: tinted by theme)
  const fl=0.028+0.014*Math.sin(t2*11)+0.010*Math.sin(t2*47+1.3);
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const lg2=ctx.createRadialGradient(90,60,10,90,60,240);
  lg2.addColorStop(0,"rgba("+TH.lamp+","+Math.max(0.008,fl).toFixed(3)+")");
  lg2.addColorStop(1,"rgba("+TH.lamp+",0)");
  ctx.fillStyle=lg2; ctx.fillRect(0,0,LW,320);
  ctx.restore();
  // ambient dust motes drifting through the lamp light (v11: theme-tinted)
  if(Game.motes&&Game.motes.length){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(const m of Game.motes){
      const a=0.05+0.07*(0.5+0.5*Math.sin(Game.time/700+m.ph));
      ctx.fillStyle="rgba("+TH.mote+","+a.toFixed(3)+")";
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawScrew(s,x,y,scale,alpha,dimmed,lift){
  const sp=screwSprite(s.color);
  const sc=scale||1;
  // squash-and-stretch on landing (bonk) + wake bounce when newly exposed
  const lt=clamp(s.landT||0,0,1);
  const wk=s.wakeT>0?Math.sin((1-s.wakeT)*Math.PI):0;
  const sqx=(1+0.30*lt)*(1+0.28*wk), sqy=(1-0.30*lt)*(1+0.28*wk);
  const lf=lift||0;
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  if(dimmed) ctx.globalAlpha*=0.45;
  const dx=s.denyT>0?Math.sin(Game.time/26)*5:0;
  // soft radial drop shadow (shrinks/fades as the screw lifts)
  const shR=20*sc*(1-0.35*lf), shA=(dimmed?0.45:1)*0.38*(1-0.65*lf);
  if(shA>0.01){
    const shg=ctx.createRadialGradient(x+dx,y+20*sc,2,x+dx,y+20*sc,shR);
    shg.addColorStop(0,"rgba(0,0,0,"+shA.toFixed(3)+")");
    shg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=shg;
    ctx.beginPath(); ctx.ellipse(x+dx,y+20*sc,shR,shR*0.55,0,0,7); ctx.fill();
  }
  const w=sp.w*sc, h=sp.h*sc;
  ctx.translate(x+dx,y-8*wk); ctx.scale(sqx,sqy);
  ctx.drawImage(sp.img,-w/2,-h/2,w,h);
  // v11: rotating metallic sheen on the screw head
  const sheenA=0.10+0.08*Math.sin((s.rot||0)*2+Game.time/700);
  ctx.save(); ctx.rotate((s.rot||0)*0.4);
  const sg=ctx.createLinearGradient(-15*sc,0,15*sc,0);
  sg.addColorStop(0,"rgba(255,255,255,0)");
  sg.addColorStop(0.5,"rgba(255,255,255,"+sheenA.toFixed(3)+")");
  sg.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(0,0,14*sc,0,7); ctx.fill();
  ctx.restore();
  // rotating slot
  ctx.save();
  ctx.rotate(s.rot||0);
  ctx.strokeStyle="rgba(15,20,36,0.85)"; ctx.lineWidth=4*sc; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-9*sc,0); ctx.lineTo(9*sc,0); ctx.stroke();
  ctx.restore();
  // blinking eyes (lid sweep over the baked sprite eyes at +/-6.5,-4)
  if(s.blinkT!=null&&s.blinkT<140){
    ctx.strokeStyle="rgba(20,26,44,0.85)"; ctx.lineWidth=2.6*sc; ctx.lineCap="round";
    for(const ex of [-6.5,6.5]){
      ctx.beginPath(); ctx.moveTo((ex-5)*sc,-4*sc); ctx.lineTo((ex+5)*sc,-4*sc); ctx.stroke();
    }
  }
  ctx.restore();
  if(s.pinned){
    // gold lock badge
    ctx.save();
    ctx.fillStyle="#fbbf24";
    ctx.beginPath(); ctx.arc(x+13*sc,y-13*sc,8*sc,0,7); ctx.fill();
    ctx.lineWidth=2*sc; ctx.strokeStyle="#92400e";
    ctx.beginPath(); ctx.arc(x+13*sc,y-13*sc,8*sc,0,7); ctx.stroke();
    ctx.fillStyle="#92400e"; ctx.font=font(900,12*sc);
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("!",x+13*sc,y-12.5*sc);
    ctx.restore();
  }
}

function drawPlate(p){
  const L=Game.L;
  ctx.save();
  let dx=0, dy=0, rot=0, alpha=1, sc=1;
  // level intro: plates drop in from above with a bounce, staggered
  if(L&&L.introT<1&&p.introDelay!=null){
    const k=clamp((L.introT*1200-p.introDelay)/480,0,1);
    if(k<1){ const e=easeOutBack(k); dy=-(1-e)*430; alpha=clamp(k*2.5,0,1); }
  }
  if(p.popped){
    const k=easeIn(clamp(p.popT,0,1));
    dy=-140*k; rot=0.5*k; alpha=1-k; sc=1+0.15*k;
    dx=Math.sin(p.popT*30)*8*(1-k);
  }
  ctx.globalAlpha=alpha;
  // soft radial drop shadow
  const shx=p.x+p.w/2, shy=p.y+p.h+10;
  const shg=ctx.createRadialGradient(shx,shy,4,shx,shy,p.w*0.5);
  shg.addColorStop(0,"rgba(0,0,0,0.38)"); shg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=shg;
  ctx.beginPath(); ctx.ellipse(shx,shy+dy*0.3,p.w*0.5,13,0,0,7); ctx.fill();
  ctx.translate(p.x+p.w/2+dx,p.y+p.h/2+dy);
  ctx.rotate(rot); ctx.scale(sc,sc); ctx.translate(-p.w/2,-p.h/2);
  const sp=plateSprite(p.w,p.h);
  ctx.drawImage(sp.img,0,0,p.w,p.h);
  ctx.restore();
  // screws on this plate (topmost = drawn)
  if(!p.popped){
    for(const s of p.screws){
      if(s.state!=="plate") continue;
      const blocked=Game.isBlocked(s);
      drawScrew(s,s.x,s.y+dy,1,1,blocked,0);
      // hint: pulsing gold ring on the suggested screw (FIX: hint was invisible)
      if(L&&L.hintId===s.id){
        const pr=30+Math.sin(Game.time/190)*4;
        ctx.save();
        ctx.globalAlpha=0.85;
        ctx.strokeStyle="#fde047"; ctx.lineWidth=4;
        ctx.shadowColor="#fde047"; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.arc(s.x,s.y+dy,pr,0,7); ctx.stroke();
        ctx.restore();
      }
    }
  }
}

function drawTray(){
  const L=Game.L, H=L.holes;
  ctx.save();
  // tray bar
  ctx.fillStyle="rgba(0,0,0,0.35)";
  rr(ctx,14,TRAY_Y-44+4,LW-28,96,18); ctx.fill();
  const g=ctx.createLinearGradient(0,TRAY_Y-44,0,TRAY_Y+52);
  g.addColorStop(0,"#3d4a6e"); g.addColorStop(0.5,"#2b3450"); g.addColorStop(1,"#1d2438");
  ctx.fillStyle=g; rr(ctx,14,TRAY_Y-44,LW-28,96,18); ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle="rgba(255,209,102,0.35)";

  gloss(ctx,18,TRAY_Y-40,LW-36,88,14,0.12);
  ctx.fillStyle="#ffe9b0"; ctx.font=font(800,13); ctx.textAlign="left"; ctx.textBaseline="middle";
  spaced(2); ctx.fillText("SCREW TRAY",30,TRAY_Y-30); unspaced();
  // holes
  const r=Math.min(25,((LW-80)/H)/2-5);
  for(let i=0;i<H;i++){
    const hx=holeX(i,H);
    const hs=holeSprite(Math.round(r));
    ctx.drawImage(hs.img,hx-hs.cx, TRAY_Y-hs.cy, hs.w, hs.h);
  }
  // danger: pulsing amber/red edge glow when only 1 hole is free
  if(L&&!L.won&&L.winT<0&&L.loseT<0){
    let free=0;
    for(let i=0;i<H;i++) if(L.tray[i]==null) free++;
    if(free===1){
      const pu=0.5+0.5*Math.sin(Game.time/170);
      ctx.save();
      ctx.strokeStyle="rgba(248,113,113,"+(0.45+0.45*pu).toFixed(3)+")";
      ctx.lineWidth=4+3*pu;
      ctx.shadowColor="#f87171"; ctx.shadowBlur=16+10*pu;
      rr(ctx,14,TRAY_Y-44,LW-28,96,18); ctx.stroke();
      ctx.restore();
    }
  }
  // screws resting in holes (not flying)
  const flying=new Set(L.flights.map(f=>f.screw.id));
  for(let i=0;i<H;i++){
    const id=L.tray[i];
    if(id==null||flying.has(id)) continue;
    const s=Game.screwById(id);
    if(s&&s.state==="tray") drawScrew(s,holeX(i,H),TRAY_Y,0.92,1,false);
  }
  ctx.restore();
}

function drawParts(){
  for(const p of Game.parts){
    const k=1-p.t/p.life;
    ctx.save();
    if(p.steam){
      // soft expanding steam puff
      const kk=clamp(p.t/p.life,0,1);
      ctx.globalAlpha=0.16*(1-kk);
      ctx.fillStyle="#cbd5e1";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+kk*1.8),0,7); ctx.fill();
    }else if(p.flash){
      // additive birth flash: expanding radial glow
      const kk=easeOut(clamp(p.t/p.life,0,1));
      const r=p.r0+(p.r1-p.r0)*kk;
      ctx.globalCompositeOperation="lighter";
      const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,Math.max(2,r));
      g.addColorStop(0,p.colA||"rgba(255,255,255,0.9)");
      g.addColorStop(0.4,p.col||"rgba(253,224,71,0.55)");
      g.addColorStop(1,"rgba(253,224,71,0)");
      ctx.globalAlpha=clamp(k*1.4,0,1);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(2,r),0,7); ctx.fill();
    }else if(p.ring){
      // shockwave ring
      const kk=easeOut(clamp(p.t/p.life,0,1));
      const r=p.r0+(p.r1-p.r0)*kk;
      ctx.globalAlpha=clamp(k,0,1)*0.9;
      ctx.strokeStyle=p.col; ctx.lineWidth=3.5*(1-kk)+1;
      ctx.shadowColor=p.col; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.stroke();
    }else{
      ctx.globalAlpha=clamp(k,0,1);
      ctx.fillStyle=p.col;
      if(p.rect){
        ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
        ctx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
      }else{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*k+0.5,0,7); ctx.fill();
      }
    }
    ctx.restore();
  }
}

/* ---------- headline with staggered letter pop-in (v7) ---------- */
function popText(str,cx,y,t,style,fnt){
  ctx.save();
  ctx.font=fnt; ctx.textBaseline="middle";
  const chars=[...str], sp=2;
  const ws=chars.map(ch=>ctx.measureText(ch).width+sp);
  const total=ws.reduce((a,b)=>a+b,0)-sp;
  let x=cx-total/2;
  ctx.fillStyle=style;
  for(let i=0;i<chars.length;i++){
    const k=clamp((t-i*45)/320,0,1);
    if(k>0){
      const sc=Math.max(0.01,easeOutBack(k));
      ctx.save();
      ctx.translate(x+ws[i]/2,y); ctx.scale(sc,sc);
      ctx.globalAlpha=clamp(k*2.5,0,1);
      ctx.textAlign="center";
      ctx.fillText(chars[i],0,0);
      ctx.restore();
    }
    x+=ws[i];
  }
  ctx.restore();
}

function fmtDur(ms){
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  const p=n=>String(n).padStart(2,"0");
  return h>0?(h+":"+p(m)+":"+p(ss)):(m+":"+p(ss));
}

/* ---------- main draw ---------- */
function draw(){
  if(!ctx) return;
  ctx.save();
  if(Game.shake>0) ctx.translate(rnd(-1,1)*Game.shake/50, rnd(-1,1)*Game.shake/50);
  if(Game.punch>0){
    // screen punch zoom on plate pop
    const ps=1+0.05*Game.punch;
    ctx.translate(240,400); ctx.scale(ps,ps); ctx.translate(-240,-400);
  }
  drawBackground();
  const sc=Game.screen;
  // v11: music follows the context when in AUTO (workshop / drive for TA / chill for daily)
  if(Game.musicMode==="auto"){
    let want="workshop";
    if(sc==="play"&&Game.L) want=Game.L.mode==="ta"?"drive":Game.L.mode==="daily"?"chill":"workshop";
    try{ Sfx.setStyle(want); }catch(e){}
  }
  if(sc==="title"){ drawTitle(); }
  else if(sc==="select"){ drawSelect(); }
  else if(sc==="stats"){ drawStats(); }      // v10
  else if(sc==="themes"){ drawThemes(); }    // v11
  else if(sc==="taover"){ drawTAOver(); }    // v10
  else if(Game.L){
    const L=Game.L;
    // plates low layer first
    const ps=L.plates.slice().sort((a,b)=>a.layer-b.layer);
    for(const p of ps) drawPlate(p);
    // flights above plates
    for(const f of L.flights){
      const s=f.screw;
      let x,y,sc2,lift;
      if(f.phase==="unscrew"){
        const k=clamp(f.t/200,0,1);
        x=f.fx; y=f.fy-26*k; sc2=1+0.25*k; lift=k*0.4;
      }else{
        const k=clamp(f.t/320,0,1), e=easeInOut(k);
        x=lerp(f.fx,f.tx,e); y=lerp(f.fy,f.ty,e)-Math.sin(k*Math.PI)*70; sc2=1.25-0.33*e;
        lift=Math.sin(k*Math.PI);
        // target highlight: pulsing ring on the destination hole while flying (v6)
        const pu=0.5+0.5*Math.sin(Game.time/150);
        ctx.save();
        ctx.globalAlpha=0.35+0.4*pu;
        ctx.strokeStyle="#fde047"; ctx.lineWidth=3;
        ctx.shadowColor="#fde047"; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(f.tx,f.ty,22+4*pu,0,7); ctx.stroke();
        ctx.restore();
      }
      drawScrew(s,x,y,sc2,1,false,lift);
    }
    // clearing trio flights
    for(const c of L.clearing) drawScrew(c.screw,c.screw.x,c.screw.y,1,1,false);
    drawTray();
    drawParts(); drawFloats();
    drawHUD(); drawBottomBar();
    drawTut();
    // level intro ribbon: "LEVEL N" slides in and fades while plates drop (v8)
    if(L.introT<1&&sc==="play"){
      const t=L.introT*1150;
      const inK=easeOut(clamp(t/380,0,1)), outK=clamp((t-800)/350,0,1);
      ctx.save();
      ctx.globalAlpha=(1-outK)*clamp(inK*2,0,1);
      ctx.translate(240,-60+170*inK);
      ctx.fillStyle="rgba(30,41,59,0.94)";
      rr(ctx,-130,-30,260,60,14); ctx.fill();
      ctx.strokeStyle="rgba(251,191,36,0.85)"; ctx.lineWidth=2.5;
      rr(ctx,-130,-30,260,60,14); ctx.stroke();
      ctx.fillStyle="#fde047"; ctx.font=font(900,26); ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("LEVEL "+(Game.levelIdx+1),0,2);
      ctx.restore();
    }
    // danger vignette: pulsing red screen edges when only 1 hole is free (v6)
    if(L.danger&&sc==="play"){
      const pu=0.5+0.5*Math.sin(Game.time/200);
      const vg=ctx.createRadialGradient(240,400,220,240,400,520);
      vg.addColorStop(0,"rgba(239,68,68,0)");
      vg.addColorStop(1,"rgba(239,68,68,"+(0.22+0.20*pu).toFixed(3)+")");
      ctx.fillStyle=vg; ctx.fillRect(0,0,LW,LH);
    }
    if(L.winT>0) drawBanner("NICE!",null);
    if(L.loseT>0) drawBanner("JAMMED!",null);
    if(sc==="pause") drawPause();
    else if(sc==="win"){ drawWin(); drawParts(); } // coin shower over the panel (v8)
    else if(sc==="lose"){ drawLose(); drawParts(); } // tears fall over the panel (v7)
  }
  ctx.restore();
  if(Game.fade>0){
    ctx.globalAlpha=clamp(Game.fade/380,0,1);
    ctx.fillStyle="#04070f"; ctx.fillRect(0,0,LW,LH);
    ctx.globalAlpha=1;
  }
  if(Game.irisT>0){
    // radial reveal: dark vignette that opens from the center at level start
    const k=easeOut(1-Game.irisT), r=90+k*880;
    const g=ctx.createRadialGradient(240,400,r*0.55,240,400,r+140);
    g.addColorStop(0,"rgba(4,7,15,0)"); g.addColorStop(1,"rgba(4,7,15,0.94)");
    ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);
  }
}

Game.onTap=function(x,y){
  Sfx.ensure(); Sfx.gesture();
  const ui=this.ui;
  if(this.screen==="title"){
    if(hit(x,y,ui.play)){ Sfx.click(); this.fade=380; this.screen="select"; try{Portal.gameplayStart();}catch(e){} return; }
    if(hit(x,y,ui.ta)){ Sfx.click(); this.fade=380; this.startTimeAttack(); return; }
    if(hit(x,y,ui.daily)){ Sfx.click(); this.fade=380; this.startDaily(); return; }
    if(hit(x,y,ui.stats)){ Sfx.click(); this.screen="stats"; return; }
    if(hit(x,y,ui.themes)){ Sfx.click(); this.screen="themes"; return; }   // v11
    if(hit(x,y,ui.musicBtn)){ this.cycleMusic(); return; }                 // v11
    if(hit(x,y,ui.muteT)){ this.toggleMute(); return; }
    return;
  }
  if(this.screen==="select"){
    if(hit(x,y,ui.back)){ Sfx.click(); this.screen="title"; return; }
    if(hit(x,y,ui.noUndoT)){ Sfx.click(); this.noUndo=!this.noUndo; Store.set("noUndo",this.noUndo?"1":"0"); return; }
    for(let i=0;i<LEVELS.length;i++){
      if(hit(x,y,ui["lv"+i])){ Sfx.click(); this.levelIdx=i; this.fade=380; this.loadLevel(i); return; }
    }
    return;
  }
  if(this.screen==="play"){
    const L=this.L;
    if(hit(x,y,ui.pause)){ Sfx.click(); this.screen="pause"; try{Portal.gameplayStop();}catch(e){} return; }
    if(hit(x,y,ui.mute)){ this.toggleMute(); return; }
    if(hit(x,y,ui.undo)){ this.doUndo(); return; }
    if(hit(x,y,ui.hint)){ this.doHint(); return; }
    if(hit(x,y,ui.retry)){ Sfx.click();
      // v10: retry restarts in the same mode
      if(L.mode==="ta") this.loadLevelTA();
      else if(L.mode==="daily") this.buildLevel(-1,this._dailySpec,"daily");
      else this.loadLevel(this.levelIdx);
      return; }
    if(L.introT<1) return; // plates are still dropping in — input gated, visuals only
    // screws: topmost = highest layer, then later plate
    let best=null, bd=1e9;
    for(const id of L.rem){
      const s=this.screwById(id);
      if(!s||s.state!=="plate") continue;
      const d=Math.hypot(x-s.x,y-s.y);
      if(d<30){
        if(!best||L.plates[s.plate].layer>L.plates[best.plate].layer||d<bd-12){ best=s; bd=d; }
      }
    }
    if(best){ this.tapScrewById(best.id); return; }
    return;
  }
  if(this.screen==="pause"){
    if(hit(x,y,ui.resume)){ Sfx.click(); this.screen="play"; try{Portal.gameplayStart();}catch(e){} }
    else if(hit(x,y,ui.restart)){ Sfx.click(); this.replayLevel(); }
    else if(hit(x,y,ui.muteP)){ this.toggleMute(); }
    else if(hit(x,y,ui.mute)){ this.toggleMute(); }
    return;
  }
  if(this.screen==="win"){
    if(hit(x,y,ui.next)){
      Sfx.click();
      this.maybeInterstitial();
      const nx=Math.min(this.levelIdx+1,LEVELS.length-1);
      if(nx===this.levelIdx&&this.levelIdx>=LEVELS.length-1){ this.screen="select"; }
      else { this.levelIdx=nx; this.fade=380; this.loadLevel(nx); }
    }
    else if(hit(x,y,ui.replayW)){ Sfx.click(); this.fade=380; this.replayLevel(); }
    else if(hit(x,y,ui.menuW)){ Sfx.click(); this.maybeInterstitial(); this.screen="select"; }
    return;
  }
  if(this.screen==="lose"){
    if(hit(x,y,ui.retryL)){ Sfx.click(); this.replayLevel(); }
    else if(hit(x,y,ui.menuL)){ Sfx.click(); this.screen="select"; }
    return;
  }
  // v10: stats + time-attack results
  if(this.screen==="stats"){
    if(hit(x,y,ui.backS)){ Sfx.click(); this.screen="title"; }
    return;
  }
  // v11: themes gallery
  if(this.screen==="themes"){
    if(hit(x,y,ui.backT)){ Sfx.click(); this.screen="title"; return; }
    for(let i=0;i<THEMES.length;i++){
      if(hit(x,y,ui["theme"+i])){ this.applyTheme(i); return; }
    }
    return;
  }
  if(this.screen==="taover"){
    if(hit(x,y,ui.retryTA)){ Sfx.click(); this.fade=380; this.startTimeAttack(); }
    else if(hit(x,y,ui.menuTA)){ Sfx.click(); this.maybeInterstitial(); this.screen="title"; }
    return;
  }
};

/* ================= LOOP & BOOT ================= */
let lastT=0, frames=0;
function frame(t){
  try{
    if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(frame);
    let dt=Math.min(50,(t-lastT)||16); lastT=t;
    Game.tick(dt); draw(); frames++;
    if(frames===2){ try{ Portal.gameReady(); }catch(e){} }
  }catch(e){}
}
function applyProgress(v,merge){
  var coins=parseInt(v[0]||"0",10)||0,
      unlocked=parseInt(v[1]||"1",10)||1,
      completions=parseInt(v[5]||"0",10)||0, stars={};
  try{ stars=JSON.parse(v[2]||"{}"); }catch(e){ stars={}; }
  // v10: records, stats, time-attack best, no-undo pref, daily streak
  var records={}, stats=null, taBest=0, noUndo=false, daily={date:"",streak:0};
  try{ records=JSON.parse(v[6]||"{}")||{}; }catch(e){ records={}; }
  try{ stats=JSON.parse(v[7]||"null"); }catch(e){ stats=null; }
  taBest=parseInt(v[8]||"0",10)||0;
  noUndo=v[9]==="1";
  try{ const d=JSON.parse(v[10]||"null"); if(d&&typeof d.streak==="number") daily=d; }catch(e){}
  // v11: theme, music mode, seen theme-unlock toasts
  var themeIdx=parseInt(v[11]||"0",10);
  if(!(themeIdx>=0&&themeIdx<THEMES.length)) themeIdx=0;
  var musicMode=v[12]||"auto";
  if(["auto","workshop","drive","chill"].indexOf(musicMode)<0) musicMode="auto";
  var themeSeen={};
  try{ themeSeen=JSON.parse(v[13]||"{}")||{}; }catch(e){ themeSeen={}; }
  const DEFSTATS={wins:0,trios:0,screws:0,moves:0,ms:0,bestCombo:0,taGames:0};
  function normStats(s){ const o=Object.assign({},DEFSTATS); if(s) for(const k in DEFSTATS) if(typeof s[k]==="number") o[k]=s[k]; return o; }
  function betterRec(a,b){ // fewer moves wins; tie -> less time
    if(!a) return b; if(!b) return a;
    return (b.m<a.m||(b.m===a.m&&b.t<a.t))?b:a;
  }
  if(merge){
    /* Fusión conservadora: nunca se pierde progreso ganado en esta sesión. */
    if(coins>Game.coins) Game.coins=coins;
    if(unlocked>Game.unlocked) Game.unlocked=unlocked;
    if(completions>Game.completions) Game.completions=completions;
    for(var k in stars){ if(stars.hasOwnProperty(k)&&(!Game.stars[k]||stars[k]>Game.stars[k])) Game.stars[k]=stars[k]; }
    for(var k2 in records){ if(records.hasOwnProperty(k2)) Game.records[k2]=betterRec(Game.records[k2],records[k2]); }
    const ns=normStats(stats), gs=Game.stats;
    for(const k3 in DEFSTATS) if(ns[k3]>gs[k3]) gs[k3]=ns[k3];
    if(taBest>Game.taBest) Game.taBest=taBest;
    if((daily.date||"")>(Game.daily.date||"")) Game.daily=daily;
    else if(daily.date&&daily.date===Game.daily.date&&daily.streak>Game.daily.streak) Game.daily.streak=daily.streak;
    if(v[3]==="1"){ Game.muted=true; Sfx.muted=true; }
    if(v[4]==="1") Game.seenTut=true;
    /* noUndo: en merge se respeta el toggle de la sesión actual. */
    /* v11: theme/musicMode también respetan la sesión actual en merge. */
    Game._themeSeen=Game._themeSeen||{};
    for(const sk in themeSeen) if(themeSeen.hasOwnProperty(sk)) Game._themeSeen[sk]=true;
  }else{
    Game.coins=coins; Game.unlocked=unlocked; Game.stars=stars;
    Game.muted=v[3]==="1"; Sfx.muted=Game.muted;
    Game.seenTut=v[4]==="1"; Game.completions=completions;
    Game.records=records; Game.stats=normStats(stats); Game.taBest=taBest;
    Game.noUndo=noUndo; Game.daily=daily;
    Game.themeIdx=themeIdx; Game.musicMode=musicMode; Game._themeSeen=themeSeen;
    // v11: returning players already past the thresholds shouldn't get spammed
    for(let ti=1;ti<THEMES.length;ti++) if(Game.themeUnlocked(ti)) Game._themeSeen[ti]=true;
    try{ paintBackground(); }catch(e){}   // repaint with the restored theme
  }
  Game.coinsShown=Game.coins;
}
/* Re-lee el progreso con el Store activo. Los adaptadores de portal con
   storage async (Playgama) lo llaman cuando su SDK queda listo DESPUÉS
   del boot, porque el boot leyó el Store anterior (localStorage). */
window.__reapplyProgress=function(){
  return Promise.all([Store.get("coins"),Store.get("unlocked"),Store.get("stars"),
    Store.get("muted"),Store.get("seenTut"),Store.get("completions"),

    Store.get("noUndo"),Store.get("daily"),
    Store.get("theme"),Store.get("musicMode"),Store.get("themeSeen")])   // v11
    .then(function(v){ applyProgress(v,true); }).catch(function(){});
};

  cleared(){ return Game.clearedCount(); },          // v11
  cycleMusic(){ Game.cycleMusic(); return Game.musicMode; },   // v11
  tappable(){ return Game.L?Game.tappable():[]; },
  tapScrew(i){
    const t=Game.tappable();
    if(i<0||i>=t.length) return false;
    return Game.tapScrewById(t[i]);
  },
  tapScrewById(id){ return Game.tapScrewById(id); },
  reset(){ Game.loadLevel(Game.levelIdx); return true; },
  gotoLevel(n){ Game.levelIdx=n-1; Game.loadLevel(n-1); return true; },
  undo(){ Game.doUndo(); return true; },
  autoWin(){
    // TEST ONLY: plays a solver-guided winning line through real tap logic
    const L0=Game.L;
    let guard=0;
    while(Game.screen==="play"&&guard<600){
      guard++;
      const L=Game.L;
      if(!L||L.rem.length===0) break;
      const rem=L.rem.filter(id=>{ const s=Game.screwById(id); return s&&s.state==="plate"; });
      let sol=null;
      try{ sol=solveState(rem,L.counts.slice(),L.plates,L.screws,L.K,L.holes,400); }catch(e){ sol=null; }
      let id=-1;
      if(sol&&sol.length){
        const s=Game.screwById(sol[0]);
        if(s&&!Game.isBlocked(s)) id=sol[0];
      }
      if(id<0){ const t=Game.tappable(); if(!t.length) break; id=t[0]; }
      Game.tapScrewById(id);
      // settle pending end-of-level timers instantly
      if(Game.L.winT>0){ Game.L.winT=-1; Game.onWin(); }
      if(Game.L.loseT>0){ Game.L.loseT=-1; Game.onLose(); }
    }
    return {won:Game.screen==="win", moves:Game.L?Game.L.moves:0, guard:guard};
  },
  forceLose(){
    // TEST ONLY: engineers a tray deadlock (holes full, no color x3),
    // then runs the real end-check -> lose transition
    const L=Game.L;
    if(!L||Game.screen!=="play") return {ok:false};
    const ids=L.rem.slice(0,L.holes);
    if(ids.length<L.holes) return {ok:false, reason:"not enough screws"};
    L.tray=new Array(L.holes).fill(null);
    L.flights=[];
    ids.forEach((id,h)=>{
      const s=Game.screwById(id);
      s.state="tray"; s.hole=h; L.tray[h]=id;
    });
    // counts with max<=2 (possible since H<=2K in every level)
    L.counts=new Array(L.K).fill(0);
    for(let h=0;h<L.holes;h++){
      let c=h%L.K, guard=0;
      while(L.counts[c]>=2&&guard<16){ c=(c+1)%L.K; guard++; }
      L.counts[c]++;
    }
    L.rem=L.rem.filter(id=>ids.indexOf(id)<0);
    Game.checkEnd();
    if(L.loseT>0){ L.loseT=-1; Game.onLose(); }
    return {ok:Game.screen==="lose"};
  },
};
