    ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.fillText(r[1],400,y);
  });
  Game.uiOvClose=button(140,592,200,48,"CLOSE",null,"#475569");
}
function drawMedalsOv(){
  panel(90,600);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; ctx.font=font(900,24); spaced(2);
  ctx.fillText("ACHIEVEMENTS",240,136); unspaced();
  const un=ACH.filter(a=>Ach.has(a.id)).length;
  ctx.fillStyle="#fde047"; ctx.font=font(700,15);
  ctx.fillText(un+"/"+ACH.length+" unlocked",240,164);
  // v15: two columns to fit 21 achievements
  ACH.forEach((a,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const bx=col===0?44:254, y=200+row*36, got=Ach.has(a.id);
    ctx.fillStyle=got?"#fde047":"#475569";
    ctx.beginPath(); ctx.arc(bx,y,9,0,7); ctx.fill();
    if(got){ ctx.fillStyle="#12233f"; ctx.font=font(900,12); ctx.textAlign="center"; ctx.fillText("★",bx,y+1); }
    ctx.textAlign="left";
    ctx.font=font(700,12.5); ctx.fillStyle=got?"#fff":"#64748b";
    ctx.fillText(a.name,bx+16,y-6);
    ctx.font=font(500,10.5); ctx.fillStyle=got?"#94a3b8":"#475569";
    const dn=a.desc.length>26?a.desc.slice(0,25)+"…":a.desc;
    ctx.fillText(dn,bx+16,y+10);
  });
  Game.uiOvClose=button(140,626,200,48,"CLOSE",null,"#475569");
}
function drawGarageOv(){
  // v15: 8 skins — compact rows
  panel(96,634);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; ctx.font=font(900,24); spaced(2);
  ctx.fillText("GARAGE",240,140); unspaced();
  ctx.fillStyle="#fde047"; ctx.font=font(700,16);
  ctx.fillText("$"+Game.coins+"   •   "+Game.skinsOwned.length+"/"+SKINS.length+" owned",240,168);
  Game.uiGarageRow=[];
  SKINS.forEach((sk,i)=>{
    const y=204+i*56, owned=Game.skinsOwned.indexOf(sk.id)>=0, sel=Game.skin===sk.id;
    ctx.textAlign="left"; ctx.fillStyle="#fff"; ctx.font=font(800,15);
    ctx.fillText(sk.name,80,y-6);
    if(sk.stripe){ ctx.fillStyle=sk.stripe; rr(ctx,80,y+6,64,9,4); ctx.fill(); }
    else { ctx.fillStyle="#475569"; rr(ctx,80,y+6,64,9,4); ctx.fill(); }
    let label,bg;
    if(sel){ label="ON"; bg="#166534"; }
    else if(owned){ label="SELECT"; bg="#2563eb"; }
    else { label="$"+sk.cost; bg=Game.coins>=sk.cost?"#b45309":"#475569"; }
    Game.uiGarageRow[i]=button(276,y-25,124,50,label,null,bg);   // v15: 124x50 touch target
  });
  Game.uiOvClose=button(140,660,200,48,"CLOSE",null,"#475569");
}
function drawRecordsOv(){   // v15: per-level records (best time + best coins)
  panel(150,500);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff"; ctx.font=font(900,24); spaced(2);
  ctx.fillText("LEVEL RECORDS",240,196); unspaced();
  ctx.fillStyle="#94a3b8"; ctx.font=font(500,14);
  ctx.fillText("your best time & coins per level",240,224);
  const recs=Stats.data.recs||{};
  const keys=Object.keys(recs).sort((a,b)=>{
    const an=a[0]==="D"?1000+ +a.slice(1):+a.slice(1);
    const bn=b[0]==="D"?1000+ +b.slice(1):+b.slice(1);
    return bn-an;
  }).slice(0,10);
  ctx.font=font(700,13); ctx.fillStyle="#64748b";
  ctx.textAlign="left"; ctx.fillText("LEVEL",110,256);
  ctx.textAlign="right"; ctx.fillText("BEST TIME",290,256); ctx.fillText("BEST COINS",400,256);
  if(!keys.length){
    ctx.textAlign="center"; ctx.fillStyle="#64748b"; ctx.font=font(500,15);
    ctx.fillText("No records yet — finish a level!",240,340);
  }
  keys.forEach((k,i)=>{
    const y=290+i*32, r=recs[k];
    const lbl=k[0]==="D"?("DAY "+k.slice(1)):("LV "+k.slice(1));
    ctx.textAlign="left"; ctx.fillStyle="#fff"; ctx.font=font(800,15); ctx.fillText(lbl,110,y);
    ctx.textAlign="right"; ctx.fillStyle="#7dd3fc"; ctx.font=font(700,15);
    ctx.fillText(fmtTime(r.t||0),290,y);
    ctx.fillStyle="#fde047"; ctx.fillText("$"+(r.c||0),400,y);
  });
  Game.uiOvClose=button(140,596,200,48,"CLOSE",null,"#475569");
}
function drawAchToast(){
  // v13: "achievement unlocked" toast during gameplay
  if(Game.achToastT<=0||!Game.achToast) return;

/* ---------- title ---------- */

  dim();

  const tl=titleLogo();

  }

  Game.uiGarage=button(244,648,110,52,"GARAGE",null,"#7c3aed");
  Game.uiRecords=button(362,648,110,52,"RECORDS",null,"#1d4ed8");
  Game.uiMute=circleBtn(448,32,23,Game.muted?"✕":"♪","#475569");   // v15: r20->23
}

/* ================= INPUT ================= */
if(canvas&&canvas.addEventListener){
  canvas.addEventListener("pointerdown",e=>{
    try{
      e.preventDefault();
      const r=canvas.getBoundingClientRect();
      const sx=LW/((r&&r.width)||LW), sy=LH/((r&&r.height)||LH);
      const gx=(e.clientX-(r?r.left:0))*sx, gy=(e.clientY-(r?r.top:0))*sy;
      Game.pressX=gx; Game.pressY=gy; Game.pressT=Game.time; // visual: button press-down
      Game.onTap(gx,gy);
    }catch(err){}
  });
}
if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("touchmove",e=>{ try{e.preventDefault();}catch(_){}} ,{passive:false});
  document.addEventListener("dblclick",e=>{ try{e.preventDefault();}catch(_){}} );
  // v11: anti-scroll universal — espacio/flechas/wheel nunca mueven la página en portales
  document.addEventListener("keydown",e=>{
    if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","PageUp","PageDown","Home","End"].includes(e.key)){
      try{e.preventDefault();}catch(_){}
    }
  });
  document.addEventListener("wheel",e=>{ try{e.preventDefault();}catch(_){} },{passive:false});
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden) Game.autoPause(true);
    else { try{ Sfx.onShow(); }catch(e){} }   // re-align music scheduler (no catch-up burst)
  });
  if(typeof window!=="undefined") window.addEventListener("blur",()=>Game.autoPause(true));
}

/* ================= LOOP & BOOT ================= */
let lastT=0, frames=0;
function frame(t){
  try{
    if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(frame);
    let dt=Math.min(50,(t-lastT)||16); lastT=t;
    if(Game.slowmo>0){ Game.slowmo=Math.max(0,Game.slowmo-dt); dt*=0.35; }  // hit slow-mo: brief juice, logic stays consistent
    Game.tick(dt); draw(); frames++;
    if(frames===2){ try{ Portal.gameReady(); }catch(e){} try{ if(Portal.loadingStop) Portal.loadingStop(); }catch(e){} }
  }catch(e){ /* never die on a render error */ }
}
Promise.all([Store.get("coins"),Store.get("best"),Store.get("muted"),Store.get("seenTut"),Store.get("saveLevel"),Store.get("dailybest_"+dailySeed()),Stats.load(),Ach.load(),Store.get("skin"),Store.get("skins"),Store.get("seenKind_rain"),Store.get("seenKind_snow"),Store.get("seenKind_rush")]).then(v=>{
  Game.coins=parseInt(v[0]||"0",10)||0;
  Game.best=parseInt(v[1]||"0",10)||0;
  Game.muted=v[2]==="1"; Sfx.muted=Game.muted;
  Game.seenTut=v[3]==="1";
  Game.saveLevel=parseInt(v[4]||"0",10)||0;   // v10: resume in-progress level from title
  Game.dailyBest=parseInt(v[5]||"0",10)||0;   // v12: today's daily best
  Game.skin=parseInt(v[8]||"0",10)||0;        // v13: garage
  try{ Game.skinsOwned=String(v[9]||"0").split(",").map(x=>parseInt(x,10)||0); }catch(e){ Game.skinsOwned=[0]; }
  if(Game.skinsOwned.indexOf(0)<0) Game.skinsOwned.unshift(0);
  if(!SKINS[Game.skin]) Game.skin=0;
  Game.seenKind={rain:v[10]==="1",snow:v[11]==="1",rush:v[12]==="1"};   // v15: weather onboarding
  try{ Portal.boot(); }catch(e){}
  // screenshot helper: ?shot=play skips the title and starts level 1 (no tutorial overlay)
  try{ if(new URLSearchParams(location.search).get("shot")==="play"){ Game.seenTut=true; Game.newGame(); } }catch(e){}
  if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(frame);
}).catch(()=>{ try{ Portal.boot(); }catch(e){} });
